name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keepwise
          POSTGRES_PASSWORD: keepwise_dev
          POSTGRES_DB: keepwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keepwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test backend/Keepwise.slnx --configuration Release

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @keepwise/shared test
      - run: pnpm --filter @keepwise/web lint
      - run: pnpm --filter @keepwise/web build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:43124
